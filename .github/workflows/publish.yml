name: Publish

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "!**/node_modules/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish, e.g. @leo-alvarenga/pi-agent-manager@0.18.7. Leave empty to auto-detect from last commit."
        required: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect packages to publish
        id: detect
        run: |
          MATRIX='[]'

          if [ -n "${{ inputs.package }}" ]; then
            INPUT="${{ inputs.package }}"
            VERSION="${INPUT##*@}"
            NAME="${INPUT%@*}"
            MATRIX=$(jq -nc --arg name "$NAME" --arg version "$VERSION" \
              '[{"name": $name, "version": $version}]')
          else
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              DIR=$(dirname "$FILE")
              [ "$DIR" = "." ] && continue

              NAME=$(jq -r '.name' "$FILE")
              VERSION=$(jq -r '.version' "$FILE")

              PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
              if [ "$PUBLISHED" = "$VERSION" ]; then
                echo "Skipping $NAME@$VERSION — already on npm"
                continue
              fi

              MATRIX=$(echo "$MATRIX" | jq -c --arg name "$NAME" --arg version "$VERSION" \
                '. + [{"name": $name, "version": $version}]')
            done < <(git diff --name-only HEAD~1 HEAD -- '**/package.json' | grep -v node_modules)
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.matrix != '' && needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve package directory
        id: pkg
        run: |
          DIR=$(pnpm list -r --depth -1 --json | \
            jq -r --arg name "${{ matrix.package.name }}" \
            '.[] | select(.name == $name) | .path')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm --filter "${{ matrix.package.name }}" typecheck

      - name: Test
        run: pnpm --filter "${{ matrix.package.name }}" run --if-present test

      - name: Build
        run: pnpm --filter "${{ matrix.package.name }}" build

      - name: Tag and push
        run: |
          TAG="${{ matrix.package.name }}@${{ matrix.package.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ matrix.package.name }}@${{ matrix.package.version }}"
          name: "${{ matrix.package.name }} ${{ matrix.package.version }}"
          generate_release_notes: true
